[package]
name = "hostcolor"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fnv = "1.0.7"
gethostname = "1.1.0"
palette = { version = "0.7.7", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
